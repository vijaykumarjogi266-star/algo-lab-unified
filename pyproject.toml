[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-lab-unified"
version = "1.0.0"
description = "Algo Lab Unified: High-Fidelity Intraday Paper-Trading & Quantitative Research Operating System for Indian Markets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Algo Lab Core Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.12.0",
    "polars==0.20.31",
    "pyarrow==15.0.2",
    "duckdb==0.10.2",
    "fastapi==0.143.0",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic_core==2.50.1",
    "SQLAlchemy==2.1.4",
    "python-json-logger==4.2.0",
    "python-dotenv==1.2.4",
    "websockets==17.2",
]

[project.scripts]
algo-paper = "src.cli.daemon:main"
algo-preflight = "scripts.preflight_check:main"
algo-backtest = "scripts.run_offline_backtest:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*", "scripts*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
